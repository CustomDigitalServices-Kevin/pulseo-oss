# Pulseo — Sidecar clamav pour virus scan module Projets (P4c)
#
# Usage VPS :
#   docker compose -f docker-compose.clamav.yml up -d
#   docker compose -f docker-compose.clamav.yml logs -f clamav
#
# Le worker pulseo-worker se connecte sur `127.0.0.1:3310` (variables
# CLAMAV_HOST / CLAMAV_PORT dans .env.production).
#
# Sécurité : pin exact `:1.3.0` (floating tag interdit en prod, CVE history
# sur parseurs). `freshclam` actif dans le conteneur = signatures fraîches
# à chaque boot + refresh périodique.
version: "3.8"

services:
  clamav:
    image: clamav/clamav:1.4.4
    container_name: pulseo-clamav
    restart: unless-stopped
    ports:
      # Bind uniquement sur localhost — accès depuis le host Node/PM2 via
      # CLAMAV_HOST=127.0.0.1. Pas d'exposition publique.
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
      - clamav_config:/etc/clamav
    environment:
      # Active freshclam (signatures ClamAV)
      - CLAMAV_NO_FRESHCLAMD=false
      - CLAMD_CONF_StreamMaxLength=600M  # accepte gros livrables (Solution 500MB)
    # Limite RAM (PBIX 200MB peut monter les usages transitoires)
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s  # freshclam initial prend ~1min

volumes:
  clamav_data:
  clamav_config:
